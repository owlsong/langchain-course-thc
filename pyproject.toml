[project]
name = "langchain-course-thc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Todd Cooper", email = "todd.coops@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.10",
    "langchain-anthropic>=1.7.10",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-course-thc = "langchain_course_thc:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
